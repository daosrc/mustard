name: Release extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build:ext

      - name: Package zip
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          cd apps/extension/.output/chrome-mv3
          zip -r "../../../../mustard-${VERSION}-chrome.zip" .
          echo "ZIP=mustard-${VERSION}-chrome.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: mustard-*-chrome.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: mustard-*-chrome.zip
